name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run the test suite
        shell: bash
        run: |
          status=0
          python -m pytest -q --tb=long -ra > test-output.txt 2>&1 || status=$?
          cat test-output.txt
          {
            echo "### Test output"
            echo '```'
            cat test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            message="$(tail -c 3000 test-output.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' ' ')"
            echo "::error title=Test failure::${message}"
          fi
          exit "$status"

  test-platforms:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run the test suite
        shell: bash
        run: |
          status=0
          python -m pytest -q --tb=long -ra > test-output.txt 2>&1 || status=$?
          cat test-output.txt
          {
            echo "### Test output"
            echo '```'
            cat test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            message="$(tail -c 3000 test-output.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' ' ')"
            echo "::error title=Test failure::${message}"
          fi
          exit "$status"

  lint:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the package and the development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy

  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the distribution metadata
        run: twine check dist/*
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/simple-skill-manager --help
          mkdir -p /tmp/smoke/project
          /tmp/smoke/bin/simple-skill-manager \
            --skills-dir /tmp/smoke/skills \
            --env-file /tmp/smoke/env \
            --root /tmp/smoke/project \
            list --json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
