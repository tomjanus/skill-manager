[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-skill-manager"
version = "0.1.0"
description = "Manager of opencode Agent Skills: keeps them in a private folder and links or copies the ones a project needs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tom Janus" }]
keywords = ["opencode", "skills", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Filesystems",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "coverage>=7.6",
]

[project.urls]
Homepage = "https://github.com/tomjanus/skill-manager"
Repository = "https://github.com/tomjanus/skill-manager"
Issues = "https://github.com/tomjanus/skill-manager/issues"
Changelog = "https://github.com/tomjanus/skill-manager/blob/master/CHANGELOG.md"

[project.scripts]
simple-skill-manager = "skill_manager.cli:main"
skill-manager = "skill_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_manager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/skill_manager"]
